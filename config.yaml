bdb27:
  # config.yaml — BDB27 "burst vs. jump" (get-off decomposition)
  #
  # ONE active block: `bdb27:`. The previous 82 KB config (leverage x ceiling and
  # then intra-drive-regeneration blocks) is preserved verbatim at
  # archive/legacy-2026-11-05/config.legacy.yaml.
  #
  # Rule from TASK.md: "Paths, thresholds and sizes live in config.yaml; no magic
  # numbers." Every number below is a DESIGN CHOICE, not estimated from data.
  # Each one is logged in notes/decisions.md, and every one that affects a
  # confirmatory result must be copied into notes/prereg.md and frozen before the
  # first full-data run.

  project: BDB27-burst-vs-jump
  pipeline_version: 1
  seed: 20270106

  paths:
    raw: data/raw
    interim: data/interim
    parquet: data/interim/parquet
    checkpoints: data/interim/checkpoints
    tmp: data/interim/tmp
    outputs: outputs
    figures: outputs/figures
    notes: notes
    fixtures: fixtures/synthetic
    run_log: outputs/run_log.csv
    prereg: notes/prereg.md

  files:
    # Filenames relative to paths.raw. `full` tracking files do not exist on the
    # Pi; their absence is what makes --mode full fail loudly here.
    combine_tracking: combine_tracking.csv
    combine_results: combine_results.csv
    players: players.csv
    games: games.csv
    player_play: player_play.csv
    game_tracking_sample: game_tracking_2023_sample.csv
    game_tracking_full:
      - game_tracking_2023.csv
      - game_tracking_2024.csv
      - game_tracking_2025.csv

  mode:
    default: sample            # the Pi only has sample game tracking
    sample:
      tracking_key: game_tracking_sample
      provenance: PLACEHOLDER_SAMPLE
      # Parsed row count of the provided sample (2**20 - 1). A file at or below
      # this size cannot assert FULL provenance.
      sample_row_cap: 1048575
    full:
      tracking_key: game_tracking_full
      provenance: FULL

  runtime:
    duckdb_threads: 1          # Pi has 4 cores; 1 avoids RAM spikes from parallel hash joins
    duckdb_memory_limit: 1200MB
    temp_directory: data/interim/tmp
    csv_null_marker: "NA"      # verified: every nullable column uses the literal NA
    parquet_compression: zstd
    parquet_row_group_size: 122880
    chunk_rows: 250000
    min_free_mb_root: 40
    min_free_mb_interim: 1024
    rss_sample_interval_s: 0.2

  # ---------------------------------------------------------------------------
  # Position vocabularies. VERIFIED against the files (notes/schema.md §4):
  # player_play.lined_up_position uses EDGE / INTERIOR_LINE, NOT DE/DT/NT.
  # players.csv / combine_results.csv use combine_position and nfl_position,
  # which are a different vocabulary (DL, EDGE, ...). Never mix the two.
  # ---------------------------------------------------------------------------
  positions:
    dl_linedup: [EDGE, INTERIOR_LINE]
    edge_linedup: [EDGE]
    interior_linedup: [INTERIOR_LINE]
    ol_linedup: [G, T, C]
    dl_combine: [DL]           # combine_results.combine_position vocabulary

  # ---------------------------------------------------------------------------
  # Onset definition. TASK.md Phase 1(e)/Phase 2 require the SAME definition in
  # the Combine and in-game. Design choice: speed threshold sustained over
  # consecutive frames, measured relative to a pre-onset baseline.
  # Provisional until notes/prereg.md freezes it.
  # ---------------------------------------------------------------------------
  onset:
    hz: 10                     # verified: 100 ms frame spacing in BOTH settings
    method: speed_threshold    # alternatives: displacement_threshold
    speed_yds: 1.0             # DESIGN CHOICE: stationary jitter is ~0.1-0.3 yd/s; 1.0 yd/s is clearly above it
    displacement_yds: 0.10     # DESIGN CHOICE: cross-check definition (0.10 yd ~ 1 frame at 1.0 yd/s)
    sustained_frames: 2        # DESIGN CHOICE: two consecutive frames (0.2 s) to reject single-frame spikes
    baseline_window_s: 0.5     # DESIGN CHOICE: pre-onset window used for the at-rest speed estimate
    min_baseline_frames: 3     # DESIGN CHOICE: below this the baseline is not estimable -> onset PENDING
    max_latency_s: 2.0         # DESIGN CHOICE: no onset after this many s post-snap is a detection failure
    search_window_s: 3.0       # DESIGN CHOICE: stop searching for onset after this long
    interpolate_max_gap_s: 0.5 # from TASK.md: interpolate gaps under 0.5 s outside the first second
    speed_cap_yds: 12.0        # from TASK.md: flag speeds above 12 yd/s

  # ---------------------------------------------------------------------------
  # Physical-time construction (Phase 2). Distances are the distance a rusher
  # must cover to cross the line, i.e. pre-snap depth. Verified depth range in the
  # sample is 0.0-2.3 yd, so the grid is dense below 3 yd and extends to 40 yd
  # only for the Combine cross-check.
  # ---------------------------------------------------------------------------
  physical:
    distances_yd: [0.5, 1.0, 1.5, 2.0, 3.0, 5.0, 10.0, 20.0, 40.0]
    min_frames_per_interval: 2   # DESIGN CHOICE: need both brackets to interpolate
    max_frames_lost_first_s: 0   # TASK.md: no interpolation inside the first second
    drill: FORTY_YARD_DASH       # verified as the only straight-line sprint from a stance
    min_attempts_for_shrinkage: 1
    shrinkage: hierarchical      # TASK.md Phase 2: pool attempts per player, never best attempt

  # ---------------------------------------------------------------------------
  # Audit gate (Phase 1). Each is a DESIGN CHOICE recorded in decisions.md.
  # ---------------------------------------------------------------------------
  audit:
    min_matched_dl: 40            # DESIGN CHOICE: fewer than this and edge/interior splits are hopeless
    min_pass_rush_snaps_per_rusher: 50   # DESIGN CHOICE (prereg: minimum snaps per player)
    min_games_per_rusher: 3       # DESIGN CHOICE: split-half across games needs >=3
    icc_min: 0.5                  # DESIGN CHOICE: TASK.md "mean get-off split-half ICC is below the config threshold"
    min_players_for_variance: 30  # DESIGN CHOICE: between-player variance with <30 players is noise
    comb_dl_min_attempts: 1       # A single attempt is usable but cannot inform test-retest
    icc_testretest_min: 0.5       # DESIGN CHOICE for item (h)
    smallest_effect_of_interest: 0.15  # DESIGN CHOICE: 15% of between-player variance in get-off

  # ---------------------------------------------------------------------------
  # Game-snap construction (Phase 3)
  # ---------------------------------------------------------------------------
  snaps:
    exclude_blitz: true          # TASK.md Phase 3: primary set is non-blitz
    max_depth_yd: 5.0            # DESIGN CHOICE: deeper than this is not a rush alignment; flag, do not drop silently
    min_pre_snap_frames: 5       # DESIGN CHOICE: need a baseline window before the snap

  # ---------------------------------------------------------------------------
  # Schema / unit sanity bounds. These are VALIDATION bounds, not analysis
  # thresholds: a value outside them means the file or the unit assumption is
  # wrong, and the stage must stop rather than continue. Chosen wide enough that
  # only a unit error (e.g. feet vs yards) can trip them.
  # ---------------------------------------------------------------------------
  schema:
    x_y_range: [-10.0, 130.0]     # field is 0-120 yd; tracking error puts players up to ~6 yd outside
    speed_max_yds: 13.5           # fastest recorded NFL ball-carrier speeds are ~11-12 yd/s
    accel_range: [-20.0, 20.0]    # yd/s^2
    angle_range: [0.0, 360.0]     # dir / o are degrees
    get_off_range: [0.0, 5.0]     # seconds from snap to crossing the line
    depth_range: [-2.0, 8.0]      # pre-snap depth; negative = lined up behind the line

  # Statistical / reproducibility
  bootstrap:
    n_resamples: 2000
    seed: 20270108
  permutation:
    n_permutations: 1000
    seed: 20270109
