# BDB27 pipeline configuration — CEILING-BINDING TASK.
# All paths, thresholds, sizes and parameters live here (no magic numbers in code).
# Binding spec: TASK.md  ·  Pre-registration: notes/prereg.md  ·  Decisions: notes/decisions.md
#
# Pre-registration FROZEN 2026-10-12 (Conor-approved values; see notes/prereg.md, notes/decisions.md D28).
# No value below is `null`/`TBD`: a `--mode full` run is gated on this (src/gate.py) — all keys the
# consuming stage needs must be non-null and notes/prereg.md must read FROZEN. Sample mode may run with
# a-priori placeholders, always labelled `UNVALIDATED SAMPLE OUTPUT`.

project: BDB27
seed: 20270106            # fixed seed for any stochastic step

# --------------------------------------------------------------------------- #
# Paths (resolve to REPO_ROOT / value; see src/common.py::resolve)
# --------------------------------------------------------------------------- #
paths:
  raw: data/raw                 # symlink -> mounted drive (bdb27/)
  interim: data/interim         # symlink -> scratch interim dir
  parquet: data/interim/parquet # converted Parquet cache
  outputs: outputs
  figures: outputs/figures
  notes: notes
  fixtures: fixtures            # committed synthetic fixtures (schema-compliant)
  synthetic: fixtures/synthetic # synthetic fixture root (see src/synthetic_fixture.py)

# --------------------------------------------------------------------------- #
# Source filenames (keys are references used by src/common.py::csv_path)
# --------------------------------------------------------------------------- #
files:
  combine_tracking: combine_tracking.csv
  combine_results: combine_results.csv
  players: players.csv
  games: games.csv
  player_play: player_play.csv
  player_career_successes: player_career_successes.csv
  game_tracking_sample: game_tracking_2023_sample.csv
  game_tracking_full:               # full-mode sources (bigger machine)
    - game_tracking_2023.csv
    - game_tracking_2024.csv
    - game_tracking_2025.csv

# --------------------------------------------------------------------------- #
# Run mode
# --------------------------------------------------------------------------- #
mode:
  default: sample
  sample:
    game_tracking: game_tracking_sample
    provenance: UNVALIDATED SAMPLE OUTPUT
    run_game_side: false            # game-side audit items (c/d/e/h/i) are full-only
  full:
    game_tracking: game_tracking_full
    provenance: FULL
    run_game_side: true

logging:
  run_log: outputs/run_log.csv

runtime:
  duckdb_threads: 1   # single-threaded => deterministic reductions (same seed => identical outputs)

# --------------------------------------------------------------------------- #
# Phase 1 — Audit (a–i)
# --------------------------------------------------------------------------- #
audit:
  out_subdir: audit
  positions: [WR, TE]               # primary = WR; replication = TE
  primary_position: WR
  replication_position: TE
  sampling_rate_hz: 10              # nominal tracking rate (audit f)
  distance_rtol: 0.05               # provided-vs-recomputed distance rel. tolerance
  # --- go/no-go minima (FREEZE in prereg.md before a full run) ---
  min_matched_wr: 60                # matched WR (Combine -> NFL game tracking), audit gate (prereg sec5)
  min_route_snaps_per_player: 100   # route snaps/player (via route_ran), audit gate (prereg sec5)
  min_icc: 0.5                      # minimum per-feature ICC to keep a Combine feature (prereg sec4)
  # --- item status (game-side c/d/e/h/i are PENDING FULL RUN; see notes/pending_full_run.md) ---
  game_side_items_pending_full_run: [c, d, e, h, i]
  # --- drill families (audit) ---
  straight_line_drills: [FORTY_YARD_DASH]                  # -> envelope fit (Phase 2)
  cutting_drills: [THREE_CONE_DRILL, SHORT_SHUTTLE]        # -> cut metrics (Phase 2)
  skill_drill_prefix: SKILL_DRILLS                         # heterogeneous position skill blocks (neither family)
  # --- feature-extraction parameters (audit g; no magic numbers) ---
  split_distances_yd: [10, 20]          # cumulative-path distances for timing/speed splits
  speed_at_times_s: [1.0, 2.0]          # model-free speed-at-time samples (from movement onset)
  movement_onset_speed_yds: 0.5         # speed above which the athlete is deemed moving (envelope t0)
  onset_distance_yd: 0.5                # cumulative path distance defining drill start
  decel_window_frames: 5                # smoothing window (frames) for deceleration metric
  deep_pass_length_yd: 15               # pass_length >= this => "deep" route (audit i / h)
  exceedance_margin_rel: 0.0            # relative margin defining "at/over ceiling" (prereg sec6)
  exceedance_reframe_rate: 0.25         # >25% exceedance => not binding => reframe as utilization (prereg sec6)
  icc_repeat_feature_drills: [FORTY_YARD_DASH, THREE_CONE_DRILL, SHORT_SHUTTLE]
  icc_min_players_with_repeat: 5        # below this many players with >=2 attempts => ICC UNESTIMABLE
  # --- synthetic fixture (schema-compliant; planted ceiling; NEVER a finding) ---
  synthetic:
    regime: binding                     # binding | null (null = no ceiling binding; Phase-5 null case)
    seed: 424242
    n_wr: 5
    n_te: 3
    n_plays_per_player: 8
    frames_per_play: 15
    planted_exceedance_rate: 0.10       # share of in-game efforts allowed to beat the planted ceiling
    game_frame_width_yd: 53.3           # NFL field frame for synthetic game x,y
    game_frame_length_yd: 120.0

# --------------------------------------------------------------------------- #
# Phase 2 — Combine envelope  (v(t) = vmax·(1 − exp(−t/tau)); a0 = vmax/tau)
# --------------------------------------------------------------------------- #
envelope:
  out_subdir: envelope
  curve: exponential              # v(t) = vmax*(1 - exp(-t/tau))  (fitted on straight-line drills)
  a0_definition: vmax_over_tau     # a0 = vmax / tau
  fit_drills: FORTY_YARD_DASH      # straight-line family used for the envelope fit
  # --- model-free features (per attempt + per player) ---
  split_distances_yd: [5, 10, 20]  # timing/speed splits (prereg sec8)
  speed_at_times_s: [1.0, 2.0]     # model-free speed-at-time samples (prereg sec8)
  cut_metrics: [entry_speed, exit_speed, cod_deficit]  # cutting-drill metrics (prereg sec8; not headlined)
  # --- feature selection (FIXED in prereg.md before the full run) ---
  max_features: 3                  # <= 3 Combine features in the primary model
  selection_rule: [icc, vif]       # keep by ICC first, then prune by VIF
  icc_min: 0.5                     # ICC threshold, from prereg sec4 (= audit.min_icc)
  vif_max: 5.0                     # VIF ceiling / redundancy-pruning trigger (prereg sec3, sec8)
  shrinkage: hierarchical           # per-player envelope parameters are hierarchically shrunk
  min_attempts_per_player: 1        # straight-line attempts needed to fit an envelope (prereg sec8; shrinkage)
  # --- exponential-envelope fit parameters (config-driven; no magic numbers) ---
  fit:
    onset_speed_yds: 0.5            # speed above which the athlete is moving (= audit.movement_onset_speed_yds)
    vmax_bounds: [0.0, 30.0]        # yd/s  (lower, upper) — audit-consistent bounds (prereg sec4 evidence)
    tau_bounds: [0.05, 10.0]        # s     (lower, upper) — audit-consistent; wide => noisy thin attempts
    p0_tau_s: 0.8                   # initial tau guess (initial vmax guess = observed peak)
    maxfev: 5000                    # curve_fit iteration cap
    min_points: 5                   # min positive-speed frames required to attempt a fit
    min_speed_yds: 0.05             # frames with speed above this are 'positive' for the fit
  # --- plausibility flag (prereg sec3.4 pattern: flag, never silently drop) ---
  flag_vmax_over_peak: 1.5          # flag a player whose raw ceiling exceeds this x their mean peak speed
  # --- analysis population for ICC/VIF feature selection (Combine side only; prereg sec3) ---
  selection_positions: [WR, TE, DB, OL, DL, LB, RB, QB]  # all dash participants (ICC is computed over all)
  # --- candidate Combine feature pool (prereg sec3); vendor s-derived features EXCLUDED ---
  candidate_features: [peak_speed, speed_at_5yd, speed_at_10yd, speed_at_20yd,
                       speed_at_t1.0s, speed_at_t2.0s, time_to_5yd, time_to_10yd, time_to_20yd,
                       min_speed_after_peak, speed_deficit_after_peak, max_decel,
                       env_vmax, env_tau, env_a0]
  expected_features: [peak_speed, speed_at_20yd, env_vmax]  # pre-declared (prereg sec3) reliable set

# --------------------------------------------------------------------------- #
# Phase 3 — Game demand
# --------------------------------------------------------------------------- #
game:
  out_subdir: game
  thresholds_file: thresholds.json # outputs/thresholds.json (FULL in full mode; PLACEHOLDER in sample)
  # --- data-QC per-frame speed validity bound (game side only; notes/decisions.md D35) ---
  # `peak_speed` is max() over per-frame speed = step distance / dt (recomputed from x,y); one
  # noisy/duplicated frame can define a physically-impossible peak. This is the frame-level DESPIKE
  # bound (yd/s): impossible per-frame samples (speed > cap) are DISCARDED and the per-effort peak
  # and accel are recomputed from the RETAINED (valid) frames only — the effort itself is kept.
  # 12.5 yd/s = 25.6 mph — ABOVE every real in-game route speed (NGS in-game tops ~21-22 mph), so it
  # removes ONLY impossible samples. This is a DATA-QC bound, NOT an analysis knob (never tuned to a
  # result); post-freeze (prereg.md stays FROZEN; the margin 0.0 / reframe rate 0.25 are untouched).
  speed_cap_yds: 12.5
  route_snap_col: route_ran        # 'route ran' flag on player_play.csv
  # --- effort sampling ---
  top_k_efforts: 5                 # top-k efforts per fixed route-snap count (prereg sec2)
  route_snap_count: 100            # the fixed route-snap denominator (prereg sec2)
  top_k_metric: speed              # metric ranking top-k efforts within a player (speed | accel)
  # --- per-effort features ---
  effort_metrics: [speed, accel]   # per-effort speed/accel (yard-space)
  envelope_fraction: max_over_ceiling  # per-effort envelope fraction (effort / player ceiling)
  # --- Phase-2 ceiling source (envelope fraction = effort / player ceiling) ---
  ceiling:
    source_subdir: envelope        # outputs/<source_subdir>/
    file: per_player_envelope.csv  # per-player Phase-2 ceiling table
    speed_column: env_vmax         # ceiling speed (yd/s)
    accel_column: env_a0           # ceiling initial accel (yd/s^2)
  # --- effort cut-offs (produced by 00_thresholds.py; never derived from the sample) ---
  thresholds:
    method: percentile             # percentile | fixed
    high_speed_percentile: 0.90    # (prereg sec8)
    accel_percentile: 0.90         # (prereg sec8)
    histogram:                     # streamed percentile accumulation (memory-bounded)
      speed_bin_yds: 0.05
      accel_bin_yds2: 0.05
      max_speed_yds: 40.0
      max_accel_yds2: 100.0
  sample_placeholders:
    high_speed_threshold_yds: 8.0  # a-priori placeholder ONLY (never set from the sample; prereg sec8)
    accel_threshold_yds2: 3.0      # a-priori placeholder ONLY (never set from the sample; prereg sec8)

# --------------------------------------------------------------------------- #
# Phase 4 — Models
# --------------------------------------------------------------------------- #
models:
  out_subdir: models
  quantiles: [0.5, 0.75, 0.9, 0.99]  # pre-registered tau ladder (prereg sec1)
  level: effort                    # effort-level regression
  cluster: player                  # player-clustered bootstrap
  bootstrap_reps: 1000             # player-clustered bootstrap reps (prereg sec8)
  bootstrap_seed_offset: 101
  controls_without_draft: [position, age, height, weight, bmi]  # controls excluding draft (prereg sec8)
  controls_with_draft: [position, age, height, weight, bmi, draft_position]  # + draft; undrafted = level
  exceedance: true                 # model/measure the exceedance rate
  utilization: u                   # utilization covariate/quantity
  pooling: [pooled, WR, TE]        # pooled vs per-position
  fallbacks: [refit_increased_max_iter, adjacent_tau_report, pool_positions, report_null]  # prereg sec7
  # --- model specification (implementation; frozen values above are untouched) ---
  response: peak_speed             # in-game effort speed (yd/s) = the modelled outcome (efforts.csv)
  primary_feature: env_vmax        # Combine ceiling feature (prereg sec3 retained set); maps to efforts.ceiling_speed_yds
  bmi_constant: 703.0              # BMI = constant * weight_lb / height_in^2 (imperial)
  fit_max_iter: 1000               # QuantReg IRLS iteration cap (base fit)
  fit_max_iter_retry: 20000        # QuantReg iteration cap for the refit_increased_max_iter fallback
  fit_p_tol: 1.0e-06               # QuantReg primal tolerance
  bootstrap_ci: [0.025, 0.975]     # percentile CI for the player-clustered bootstrap
  min_obs_per_stratum: 5           # below this a stratum reports a null (never a forced fit)
  control_vif_max: 5.0             # drop near-collinear controls above this VIF (never the primary; = envelope.vif_max)
  utilization_percentiles: [0.05, 0.5, 0.95]  # percentiles summarising the utilization u distribution

# --------------------------------------------------------------------------- #
# Phase 5 — Validation
# --------------------------------------------------------------------------- #
validate:
  out_subdir: validate
  cv_grouping: player              # player-grouped CV
  cv_folds: 5                      # player-grouped CV folds (prereg sec8)
  cv_seed: 20270106
  baseline: controls_only          # compare against a controls-only baseline
  permutation: true
  perm_reps: 1000                  # permutation reps (prereg sec8)
  perm_tau: 0.9                    # tau at which the permutation null is computed
  perm_seed_offset: 202            # permutation RNG seed = config seed + offset (config-driven)
  measurement_error_correction: icc_attenuation  # divide slope by reliability (prereg sec8)
  measurement_error_feature: env_vmax  # feature whose ICC drives the attenuation correction
  min_repeats_for_sensitivity: 2   # thin-repeat threshold (drop_thin_repeats sensitivity)
  sensitivity: [alt_quantiles, drop_thin_repeats, exclude_optouts, margin_grid]  # prereg sec8
  sensitivity_alt_quantiles: [0.5, 0.8, 0.95]   # alt_quantiles sensitivity ladder
  sensitivity_margin_grid: [0.0, 0.01, 0.02, 0.05]  # exceedance margin grid (margin_grid sensitivity)
  optout_fields: [forty, ten_yd_split, combine_height, combine_weight]  # exclude_optouts fields

# --------------------------------------------------------------------------- #
# Phase 0.5 — External pre-Combine expectation proxies (Grinding The Mocks)
# --------------------------------------------------------------------------- #
# Source of truth: the Phase 0.5 spec in notes/phase-0.5-external-proxies.md. The task is to map
# Kaggle `nflId` to a Pre-Combine Expected Draft Position (EDP), filtered to February mock-draft
# snapshots so the EDP is uncontaminated by Combine performance. GTM is the SOLE external source.
# All paths/thresholds/parameters live here (no magic numbers in code).
external:
  enabled: true
  source: gtm                        # Grinding The Mocks (the only in-scope external source)
  out_subdir: external               # outputs/external/ (sample + synthetic labels)
  proxy_file: pre_combine_expectation.parquet   # full run writes outputs/pre_combine_expectation.parquet
  unmatched_file: unmatched_external_ids.csv
  manifest_file: external_data_manifest.md      # written under notes/ (compliance / Kaggle forum)
  raw_cache_dir: external            # data/raw/external/ (raw GTM responses cached before processing)
  years: [2023, 2024, 2025]          # draft classes represented in the Kaggle players.csv
  positions: [WR, TE]                # match-rate assertion population (spec: drafted WRs/TEs)
  require_for_phase4: true           # 04_models --mode full requires the proxy (existence + schema)
  # --- strict deliverable schema (EXACT names + order; asserted on write) ---
  schema: [nflId, Pre_Combine_EDP, match_confidence_score]
  # --- API pacing / bounded acquisition (spec: strict rate limiting) ---
  request_sleep_s: 0.5               # sleep between live calls (rate limit)
  max_retries: 2                     # bounded retries per source beyond the first attempt
  connect_timeout_s: 8
  read_timeout_s: 12
  gtm:
    # Endpoints/URLs attempted (each result + access date logged to notes/external_data_manifest.md).
    endpoints:
      - https://grindingthemocks.com/
      - https://grindingthemocks.shinyapps.io/Dashboard/
    # Raw file(s) expected once an export is obtained; cached under data/raw/external/gtm/.
    raw_files: [gtm_mock_history.csv]
  # --- February snapshot filter (spec Step 1: pre-Combine, uncontaminated by Combine perf) ---
  snapshot:
    month: 2                         # February only (Combine runs late-Feb/early-March)
  # --- EDP aggregation across the retained February snapshots (spec: median/mean per player) ---
  aggregation: median                # median | mean (median is the pre-registered choice)
  # --- fuzzy ID resolution (string similarity on Name + Draft Year + Position + College) ---
  fuzzy:
    name_weight: 0.6                 # weights combine into match_confidence_score in [0,1]
    college_weight: 0.25
    position_weight: 0.15
    year_weight: 0.0                 # draft year is a HARD filter, not a soft weight
    min_score: 0.90                  # accept a match at/above this combined score
    min_name_score: 0.80             # guard: names must be at least this similar
  # --- spec threshold: halt if the drafted WR/TE match rate is not ABOVE this ---
  min_match_rate: 0.85
  # --- synthetic GTM fixture (schema-compliant; NEVER a finding) ---
  synthetic:
    fixture_dir: synthetic/gtm       # under fixtures/ (see src/synthetic_gtm_fixture.py)
    players_file: kaggle_players.csv # fixture players table (schema-compliant subset)
    gtm_file: gtm_mock_history.csv   # fixture raw GTM mock history
    seed: 770077
    n_players: 12
    n_mocks_per_player: 6            # February snapshots per player
    n_unmatched_gtm: 3               # GTM prospects with NO Kaggle player (exercise unmatched)
    n_near_miss: 2                   # deliberate spelling perturbations (exercise fuzzy matching)

# --------------------------------------------------------------------------- #
# Deliverables / sample discipline
# --------------------------------------------------------------------------- #
deliverables:
  figures_max: 5                   # <= 5 figures (stricter than the official "<10")
  sample_label: UNVALIDATED SAMPLE OUTPUT
  kaggle_notebook: true            # public Kaggle notebook + writeup is a pass/fail gate
