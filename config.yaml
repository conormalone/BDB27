bdb27:
  # config.yaml — BDB27 "burst vs. jump" (get-off decomposition)
  #
  # ONE active block: `bdb27:`. The previous 82 KB config (leverage x ceiling and
  # then intra-drive-regeneration blocks) is preserved verbatim at
  # archive/legacy-2026-11-05/config.legacy.yaml.
  #
  # Rule from TASK.md: "Paths, thresholds and sizes live in config.yaml; no magic
  # numbers." Every number below is a DESIGN CHOICE, not estimated from data.
  # Each one is logged in notes/decisions.md, and every one that affects a
  # confirmatory result must be copied into notes/prereg.md and frozen before the
  # first full-data run.

  project: BDB27-burst-vs-jump
  pipeline_version: 1
  seed: 20270106

  paths:
    raw: data/raw
    interim: data/interim
    parquet: data/interim/parquet
    checkpoints: data/interim/checkpoints
    tmp: data/interim/tmp
    outputs: outputs
    phase2: outputs/phase2
    calibration: outputs/calibration.json
    figures: outputs/figures
    notes: notes
    fixtures: fixtures/synthetic
    run_log: outputs/run_log.csv
    prereg: notes/prereg.md

  files:
    # Filenames relative to paths.raw. `full` tracking files do not exist on the
    # Pi; their absence is what makes --mode full fail loudly here.
    combine_tracking: combine_tracking.csv
    combine_results: combine_results.csv
    players: players.csv
    games: games.csv
    player_play: player_play.csv
    game_tracking_sample: game_tracking_2023_sample.csv
    game_tracking_full:
      - game_tracking_2023.csv
      - game_tracking_2024.csv
      - game_tracking_2025.csv

  mode:
    default: sample            # the Pi only has sample game tracking
    sample:
      tracking_key: game_tracking_sample
      provenance: PLACEHOLDER_SAMPLE
      # Parsed row count of the provided sample (2**20 - 1). A file at or below
      # this size cannot assert FULL provenance.
      sample_row_cap: 1048575
    full:
      tracking_key: game_tracking_full
      provenance: FULL

  runtime:
    duckdb_threads: 1          # Pi has 4 cores; 1 avoids RAM spikes from parallel hash joins
    duckdb_memory_limit: 1200MB
    temp_directory: data/interim/tmp
    csv_null_marker: "NA"      # verified: every nullable column uses the literal NA
    parquet_compression: zstd
    parquet_row_group_size: 122880
    chunk_rows: 250000
    min_free_mb_root: 40
    min_free_mb_interim: 1024
    rss_sample_interval_s: 0.2

  # ---------------------------------------------------------------------------
  # Position vocabularies. VERIFIED against the files (notes/schema.md §4):
  # player_play.lined_up_position uses EDGE / INTERIOR_LINE, NOT DE/DT/NT.
  # players.csv / combine_results.csv use combine_position and nfl_position,
  # which are a different vocabulary (DL, EDGE, ...). Never mix the two.
  # ---------------------------------------------------------------------------
  positions:
    dl_linedup: [EDGE, INTERIOR_LINE]
    edge_linedup: [EDGE]
    interior_linedup: [INTERIOR_LINE]
    ol_linedup: [G, T, C]
    dl_combine: [DL]           # combine_results.combine_position vocabulary

  # ---------------------------------------------------------------------------
  # Onset definition. TASK.md Phase 1(e)/Phase 2 require the SAME definition in
  # the Combine and in-game. Design choice: an ABSOLUTE speed threshold
  # sustained over consecutive frames. (The pre-onset baseline is estimated and
  # reported as context, but the threshold is not baseline-relative: Phase 1's
  # reported ICCs depend on the absolute comparison, so changing it would
  # silently change a frozen measurement.) Provisional until notes/prereg.md
  # freezes it.
  # ---------------------------------------------------------------------------
  onset:
    hz: 10                     # verified: 100 ms frame spacing in BOTH settings
    sampling_tolerance_s: 0.02 # DESIGN CHOICE: a rate gate, not an analysis threshold
    method: speed_threshold    # alternatives: displacement_threshold
    speed_yds: 1.0             # DESIGN CHOICE: stationary jitter is ~0.1-0.3 yd/s; 1.0 yd/s is clearly above it
    displacement_yds: 0.10     # DESIGN CHOICE: cross-check definition (0.10 yd ~ 1 frame at 1.0 yd/s)
    sustained_frames: 2        # DESIGN CHOICE: two consecutive frames (0.2 s) to reject single-frame spikes
    baseline_window_s: 0.5     # DESIGN CHOICE: pre-onset window used for the at-rest speed estimate
    min_baseline_frames: 3     # DESIGN CHOICE: below this the baseline is not estimable -> onset PENDING
    max_latency_s: 2.0         # DESIGN CHOICE: no onset after this many s post-snap is a detection failure
    search_window_s: 3.0       # DESIGN CHOICE: stop searching for onset after this long
    interpolate_max_gap_s: 0.5 # from TASK.md: interpolate gaps under 0.5 s outside the first second
    speed_cap_yds: 12.0        # from TASK.md: flag speeds above 12 yd/s

  # ---------------------------------------------------------------------------
  # Physical-time construction (Phase 2). Distances are the distance a rusher
  # must cover to cross the line, i.e. pre-snap depth. Verified depth range in the
  # sample is 0.0-2.3 yd, so the grid is dense below 3 yd and extends to 40 yd
  # only for the Combine cross-check.
  # ---------------------------------------------------------------------------
  physical:
    # Distance grid, in yards from motion onset. Dense through the whole in-game
    # depth range (the audit measured 0.0-2.3 yd), then sparse for the 40-yard
    # cross-check. DESIGN CHOICE: a lookup grid, not a binning of results --
    # Phase 3 interpolates the per-frame attempt curve at each rep's exact depth.
    distances_yd: [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0,
                   4.0, 5.0, 10.0, 20.0, 40.0]
    min_frames_per_interval: 2   # DESIGN CHOICE: need both brackets to interpolate
    max_frames_lost_first_s: 0   # TASK.md: no interpolation inside the first second
    first_second_s: 1.0          # TASK.md wording: "only outside the first second"
    # DESIGN CHOICE: a 40-yard dash does not move half a yard backwards. More
    # than this behind the onset point means the tracked segment contains a
    # walk-back/repositioning, so "time from onset along the direction of
    # travel" is not a sprint measurement. Flagged and excluded from pooling,
    # never silently re-origined.
    max_backward_excursion_yd: 0.5
    drill: FORTY_YARD_DASH       # verified as the only straight-line sprint from a stance
    min_attempts_for_shrinkage: 1
    shrinkage: hierarchical      # TASK.md Phase 2: pool attempts per player, never best attempt
    # Parametric CROSS-CHECK only. TASK.md: "Use a parametric speed-time fit
    # (v(t) = vmax(1 - exp(-t/tau))) only as a cross-check; it is poorly
    # constrained in the first yard." It never enters the estimand.
    crosscheck:
      window_s: 2.0              # DESIGN CHOICE: fit the acceleration phase, not the plateau
      vmax_range: [5.0, 13.0]    # yd/s; verified sprint speeds are 8.5-11.9
      tau_range: [0.1, 3.0]      # s
      grid_points: 17            # DESIGN CHOICE: coarse deterministic grid
      refine_points: 9           # DESIGN CHOICE: local refinement grid
      refine_rounds: 3           # DESIGN CHOICE
      min_samples: 5             # DESIGN CHOICE: below this the fit is not reported

  # ---------------------------------------------------------------------------
  # Audit gate (Phase 1). Each is a DESIGN CHOICE recorded in decisions.md.
  # ---------------------------------------------------------------------------
  audit:
    min_matched_dl: 40            # DESIGN CHOICE: fewer than this and edge/interior splits are hopeless
    min_pass_rush_snaps_per_rusher: 50   # DESIGN CHOICE (prereg: minimum snaps per player)
    min_games_per_rusher: 3       # DESIGN CHOICE: split-half across games needs >=3
    icc_min: 0.5                  # DESIGN CHOICE: TASK.md "mean get-off split-half ICC is below the config threshold"
    min_players_for_variance: 30  # DESIGN CHOICE: between-player variance with <30 players is noise
    comb_dl_min_attempts: 1       # A single attempt is usable but cannot inform test-retest
    icc_testretest_min: 0.5       # DESIGN CHOICE for item (h)
    # Q1 revised by Conor 2026-11-05 11:11: SOI 0.25 -> 0.30. The detectable
    # floor is z*sqrt(2/P), so 0.30 needs about 86 fittable players while the
    # label-file design has 80 at the 50-rep minimum; that makes the minimum-reps
    # threshold a live decision (D106). Phase 3 reports the table; Conor chooses.
    # The realised floor is recomputed and printed, never hardcoded.
    smallest_effect_of_interest: 0.30  # share of between-player variance in get-off
    # Candidate minimum-reps thresholds for the Phase 3 sensitivity table (D106).
    # REPORT ONLY: the active threshold stays min_pass_rush_snaps_per_rusher.
    min_reps_candidates: [30, 40, 45, 50, 60]
    # Bin upper edges (inclusive lower, exclusive upper) for the per-player
    # rep-count distribution. A presentation choice, not an analysis threshold.
    reps_histogram_bins: [1, 5, 10, 25, 50, 75, 100, 150, 200, 300, 500, 750, 1000, 1500]

  # ---------------------------------------------------------------------------
  # Game-snap construction (Phase 3)
  # ---------------------------------------------------------------------------
  snaps:
    # TASK.md: "Blitzers and non-DL are excluded from primary analyses".
    # The blitz half is NOT APPLIED: player_play.blitzing is true on 92% of DL
    # pass-rush reps and null exactly on run plays (it reads as pass-rush
    # participation, not a blitz call). Excluding it would leave 27 rows of
    # 43,562. See notes/blockers.md B9 and decisions.md D103. The raw flag is
    # carried per row so a future rule can filter without a re-run.
    blitz_exclusion: not_implementable
    # Verified pass_result categories (notes/schema.md). "" is a run; R is a
    # QB scramble on a pass play and is kept.
    pass_results: [C, I, S, R, IN]
    max_depth_yd: 5.0            # DESIGN CHOICE: deeper than this is not a rush alignment; flag, do not drop silently
    # Semantic gates on the blitz flag (D104/B9). VALIDATION BOUNDS, not analysis
    # thresholds: if full data behaves differently the stage stops and the B9
    # question must be re-answered rather than silently reinterpreted. Observed
    # in the complete label file: 99.8% set on pass reps, 0.7% set on run reps.
    blitz_flag_min_share_on_pass: 0.95
    blitz_flag_max_share_on_run: 0.05
    min_pre_snap_frames: 5       # DESIGN CHOICE: need a baseline window before the snap
    # DESIGN CHOICE: games per checkpoint part. A part is skipped on re-run if
    # it exists, so a 1,000-game full run resumes instead of restarting.
    games_per_part: 25

  # ---------------------------------------------------------------------------
  # Player reliability and the Phase 4 selection rule (Phase 3b)
  #
  # Conor (2026-11-05): "I'd be interested to see per player reliability but
  # I'd say it is very low." This block fixes what is REPORTED, not what is
  # chosen: no threshold in here is applied to the data, and the active Phase 3
  # minimum stays audit.min_pass_rush_snaps_per_rusher.
  # ---------------------------------------------------------------------------
  selection:
    # Rule A candidate cuts. The task names 20/30/40/45/50/60; the first five
    # overlap audit.min_reps_candidates (the Phase 3 table), 20 is added here.
    rule_a_min_reps: [20, 30, 40, 45, 50, 60]
    # Rule B candidate reliability floors.
    rule_b_min_reliability: [0.5, 0.6, 0.7, 0.8]
    # Presentation strata for the split-half attenuation curve: players with at
    # least this many reps in EACH half. Presentation only; every stratum is
    # reported so the trend is visible.
    split_half_min_reps_per_half: [2, 5, 10, 20, 30, 50]
    # "Well estimated" = at least this many games in each half. Players with
    # fewer are reported separately, not silently pooled with the rest.
    well_estimated_min_games_per_half: 2
    # Rep counts at which the implied reliability of a player mean is tabulated.
    rep_count_grid: [20, 30, 40, 45, 50, 60, 75, 100, 150, 200, 300, 500]
    # Sensitivity grid ONLY: share of between-player variance assumed to be
    # removed by the Phase 4 physical term, used to state how much lower the
    # reliability of the residual "jump" would be. A grid, never an estimate.
    residual_share_removed_grid: [0.0, 0.25, 0.5]
    # Parametric replications of the split-half curve (diagnostic, seeded).
    split_half_simulations: 400

  # ---------------------------------------------------------------------------
  # Schema / unit sanity bounds. These are VALIDATION bounds, not analysis
  # thresholds: a value outside them means the file or the unit assumption is
  # wrong, and the stage must stop rather than continue. Chosen wide enough that
  # only a unit error (e.g. feet vs yards) can trip them.
  # ---------------------------------------------------------------------------
  schema:
    x_y_range: [-10.0, 130.0]     # field is 0-120 yd; tracking error puts players up to ~6 yd outside
    speed_max_yds: 13.5           # fastest recorded NFL ball-carrier speeds are ~11-12 yd/s
    accel_range: [-20.0, 20.0]    # yd/s^2
    angle_range: [0.0, 360.0]     # dir / o are degrees
    get_off_range: [0.0, 5.0]     # seconds from snap to crossing the line
    depth_range: [-2.0, 8.0]      # pre-snap depth; negative = lined up behind the line

  # Statistical / reproducibility
  bootstrap:
    n_resamples: 2000
    seed: 20270108
  permutation:
    n_permutations: 1000
    seed: 20270109
