# BDB27 pipeline configuration — CEILING-BINDING TASK.
# All paths, thresholds, sizes and parameters live here (no magic numbers in code).
# Binding spec: TASK.md  ·  Pre-registration: notes/prereg.md  ·  Decisions: notes/decisions.md
#
# Pre-registration FROZEN 2026-10-12 (Conor-approved values; see notes/prereg.md, notes/decisions.md D28).
# No value below is `null`/`TBD`: a `--mode full` run is gated on this (src/gate.py) — all keys the
# consuming stage needs must be non-null and notes/prereg.md must read FROZEN. Sample mode may run with
# a-priori placeholders, always labelled `UNVALIDATED SAMPLE OUTPUT`.

project: BDB27
seed: 20270106            # fixed seed for any stochastic step

# --------------------------------------------------------------------------- #
# Paths (resolve to REPO_ROOT / value; see src/common.py::resolve)
# --------------------------------------------------------------------------- #
paths:
  raw: data/raw                 # symlink -> mounted drive (bdb27/)
  interim: data/interim         # symlink -> scratch interim dir
  parquet: data/interim/parquet # converted Parquet cache
  outputs: outputs
  figures: outputs/figures
  notes: notes
  fixtures: fixtures            # committed synthetic fixtures (schema-compliant)
  synthetic: fixtures/synthetic # synthetic fixture root (see src/synthetic_fixture.py)

# --------------------------------------------------------------------------- #
# Source filenames (keys are references used by src/common.py::csv_path)
# --------------------------------------------------------------------------- #
files:
  combine_tracking: combine_tracking.csv
  combine_results: combine_results.csv
  players: players.csv
  games: games.csv
  player_play: player_play.csv
  player_career_successes: player_career_successes.csv
  game_tracking_sample: game_tracking_2023_sample.csv
  game_tracking_full:               # full-mode sources (bigger machine)
    - game_tracking_2023.csv
    - game_tracking_2024.csv
    - game_tracking_2025.csv

# --------------------------------------------------------------------------- #
# Run mode
# --------------------------------------------------------------------------- #
mode:
  default: sample
  sample:
    game_tracking: game_tracking_sample
    provenance: UNVALIDATED SAMPLE OUTPUT
    run_game_side: false            # game-side audit items (c/d/e/h/i) are full-only
  full:
    game_tracking: game_tracking_full
    provenance: FULL
    run_game_side: true

logging:
  run_log: outputs/run_log.csv

runtime:
  duckdb_threads: 1   # single-threaded => deterministic reductions (same seed => identical outputs)

# --------------------------------------------------------------------------- #
# Phase 1 — Audit (a–i)
# --------------------------------------------------------------------------- #
audit:
  out_subdir: audit
  positions: [WR, TE]               # primary = WR; replication = TE
  primary_position: WR
  replication_position: TE
  sampling_rate_hz: 10              # nominal tracking rate (audit f)
  distance_rtol: 0.05               # provided-vs-recomputed distance rel. tolerance
  # --- go/no-go minima (FREEZE in prereg.md before a full run) ---
  min_matched_wr: 60                # matched WR (Combine -> NFL game tracking), audit gate (prereg sec5)
  min_route_snaps_per_player: 100   # route snaps/player (via route_ran), audit gate (prereg sec5)
  min_icc: 0.5                      # minimum per-feature ICC to keep a Combine feature (prereg sec4)
  # --- item status (game-side c/d/e/h/i are PENDING FULL RUN; see notes/pending_full_run.md) ---
  game_side_items_pending_full_run: [c, d, e, h, i]
  # --- drill families (audit) ---
  straight_line_drills: [FORTY_YARD_DASH]                  # -> envelope fit (Phase 2)
  cutting_drills: [THREE_CONE_DRILL, SHORT_SHUTTLE]        # -> cut metrics (Phase 2)
  skill_drill_prefix: SKILL_DRILLS                         # heterogeneous position skill blocks (neither family)
  # --- feature-extraction parameters (audit g; no magic numbers) ---
  split_distances_yd: [10, 20]          # cumulative-path distances for timing/speed splits
  speed_at_times_s: [1.0, 2.0]          # model-free speed-at-time samples (from movement onset)
  movement_onset_speed_yds: 0.5         # speed above which the athlete is deemed moving (envelope t0)
  onset_distance_yd: 0.5                # cumulative path distance defining drill start
  decel_window_frames: 5                # smoothing window (frames) for deceleration metric
  deep_pass_length_yd: 15               # pass_length >= this => "deep" route (audit i / h)
  exceedance_margin_rel: 0.0            # relative margin defining "at/over ceiling" (prereg sec6)
  exceedance_reframe_rate: 0.25         # >25% exceedance => not binding => reframe as utilization (prereg sec6)
  icc_repeat_feature_drills: [FORTY_YARD_DASH, THREE_CONE_DRILL, SHORT_SHUTTLE]
  icc_min_players_with_repeat: 5        # below this many players with >=2 attempts => ICC UNESTIMABLE
  # --- synthetic fixture (schema-compliant; planted ceiling; NEVER a finding) ---
  synthetic:
    regime: binding                     # binding | null (null = no ceiling binding; Phase-5 null case)
    seed: 424242
    n_wr: 5
    n_te: 3
    n_plays_per_player: 8
    frames_per_play: 15
    planted_exceedance_rate: 0.10       # share of in-game efforts allowed to beat the planted ceiling
    game_frame_width_yd: 53.3           # NFL field frame for synthetic game x,y
    game_frame_length_yd: 120.0

# --------------------------------------------------------------------------- #
# Phase 2 — Combine envelope  (v(t) = vmax·(1 − exp(−t/tau)); a0 = vmax/tau)
# --------------------------------------------------------------------------- #
envelope:
  out_subdir: envelope
  curve: exponential              # v(t) = vmax*(1 - exp(-t/tau))  (fitted on straight-line drills)
  a0_definition: vmax_over_tau     # a0 = vmax / tau
  fit_drills: FORTY_YARD_DASH      # straight-line family used for the envelope fit
  # --- model-free features (per attempt + per player) ---
  split_distances_yd: [5, 10, 20]  # timing/speed splits (prereg sec8)
  speed_at_times_s: [1.0, 2.0]     # model-free speed-at-time samples (prereg sec8)
  cut_metrics: [entry_speed, exit_speed, cod_deficit]  # cutting-drill metrics (prereg sec8; not headlined)
  # --- feature selection (FIXED in prereg.md before the full run) ---
  max_features: 3                  # <= 3 Combine features in the primary model
  selection_rule: [icc, vif]       # keep by ICC first, then prune by VIF
  icc_min: 0.5                     # ICC threshold, from prereg sec4 (= audit.min_icc)
  vif_max: 5.0                     # VIF ceiling / redundancy-pruning trigger (prereg sec3, sec8)
  shrinkage: hierarchical           # per-player envelope parameters are hierarchically shrunk
  min_attempts_per_player: 1        # straight-line attempts needed to fit an envelope (prereg sec8; shrinkage)
  # --- exponential-envelope fit parameters (config-driven; no magic numbers) ---
  fit:
    onset_speed_yds: 0.5            # speed above which the athlete is moving (= audit.movement_onset_speed_yds)
    vmax_bounds: [0.0, 30.0]        # yd/s  (lower, upper) — audit-consistent bounds (prereg sec4 evidence)
    tau_bounds: [0.05, 10.0]        # s     (lower, upper) — audit-consistent; wide => noisy thin attempts
    p0_tau_s: 0.8                   # initial tau guess (initial vmax guess = observed peak)
    maxfev: 5000                    # curve_fit iteration cap
    min_points: 5                   # min positive-speed frames required to attempt a fit
    min_speed_yds: 0.05             # frames with speed above this are 'positive' for the fit
  # --- plausibility flag (prereg sec3.4 pattern: flag, never silently drop) ---
  flag_vmax_over_peak: 1.5          # flag a player whose raw ceiling exceeds this x their mean peak speed
  # --- analysis population for ICC/VIF feature selection (Combine side only; prereg sec3) ---
  selection_positions: [WR, TE, DB, OL, DL, LB, RB, QB]  # all dash participants (ICC is computed over all)
  # --- candidate Combine feature pool (prereg sec3); vendor s-derived features EXCLUDED ---
  candidate_features: [peak_speed, speed_at_5yd, speed_at_10yd, speed_at_20yd,
                       speed_at_t1.0s, speed_at_t2.0s, time_to_5yd, time_to_10yd, time_to_20yd,
                       min_speed_after_peak, speed_deficit_after_peak, max_decel,
                       env_vmax, env_tau, env_a0]
  expected_features: [peak_speed, speed_at_20yd, env_vmax]  # pre-declared (prereg sec3) reliable set

# --------------------------------------------------------------------------- #
# Phase 3 — Game demand
# --------------------------------------------------------------------------- #
game:
  out_subdir: game
  thresholds_file: thresholds.json # outputs/thresholds.json (FULL in full mode; PLACEHOLDER in sample)
  # --- data-QC per-frame speed validity bound (game side only; notes/decisions.md D35) ---
  # `peak_speed` is max() over per-frame speed = step distance / dt (recomputed from x,y); one
  # noisy/duplicated frame can define a physically-impossible peak. This is the frame-level DESPIKE
  # bound (yd/s): impossible per-frame samples (speed > cap) are DISCARDED and the per-effort peak
  # and accel are recomputed from the RETAINED (valid) frames only — the effort itself is kept.
  # 12.5 yd/s = 25.6 mph — ABOVE every real in-game route speed (NGS in-game tops ~21-22 mph), so it
  # removes ONLY impossible samples. This is a DATA-QC bound, NOT an analysis knob (never tuned to a
  # result); post-freeze (prereg.md stays FROZEN; the margin 0.0 / reframe rate 0.25 are untouched).
  speed_cap_yds: 12.5
  route_snap_col: route_ran        # 'route ran' flag on player_play.csv
  # --- effort sampling ---
  top_k_efforts: 5                 # top-k efforts per fixed route-snap count (prereg sec2)
  route_snap_count: 100            # the fixed route-snap denominator (prereg sec2)
  top_k_metric: speed              # metric ranking top-k efforts within a player (speed | accel)
  # --- per-effort features ---
  effort_metrics: [speed, accel]   # per-effort speed/accel (yard-space)
  envelope_fraction: max_over_ceiling  # per-effort envelope fraction (effort / player ceiling)
  # --- Phase-2 ceiling source (envelope fraction = effort / player ceiling) ---
  ceiling:
    source_subdir: envelope        # outputs/<source_subdir>/
    file: per_player_envelope.csv  # per-player Phase-2 ceiling table
    speed_column: env_vmax         # ceiling speed (yd/s)
    accel_column: env_a0           # ceiling initial accel (yd/s^2)
  # --- effort cut-offs (produced by 00_thresholds.py; never derived from the sample) ---
  thresholds:
    method: percentile             # percentile | fixed
    high_speed_percentile: 0.90    # (prereg sec8)
    accel_percentile: 0.90         # (prereg sec8)
    histogram:                     # streamed percentile accumulation (memory-bounded)
      speed_bin_yds: 0.05
      accel_bin_yds2: 0.05
      max_speed_yds: 40.0
      max_accel_yds2: 100.0
  sample_placeholders:
    high_speed_threshold_yds: 8.0  # a-priori placeholder ONLY (never set from the sample; prereg sec8)
    accel_threshold_yds2: 3.0      # a-priori placeholder ONLY (never set from the sample; prereg sec8)

# --------------------------------------------------------------------------- #
# Phase 4 — Models
# --------------------------------------------------------------------------- #
models:
  out_subdir: models
  quantiles: [0.5, 0.75, 0.9, 0.99]  # pre-registered tau ladder (prereg sec1)
  level: effort                    # effort-level regression
  cluster: player                  # player-clustered bootstrap
  bootstrap_reps: 1000             # player-clustered bootstrap reps (prereg sec8)
  bootstrap_seed_offset: 101
  controls_without_draft: [position, age, height, weight, bmi]  # controls excluding draft (prereg sec8)
  controls_with_draft: [position, age, height, weight, bmi, draft_position]  # + draft; undrafted = level
  exceedance: true                 # model/measure the exceedance rate
  utilization: u                   # utilization covariate/quantity
  pooling: [pooled, WR, TE]        # pooled vs per-position
  fallbacks: [refit_increased_max_iter, adjacent_tau_report, pool_positions, report_null]  # prereg sec7
  # --- model specification (implementation; frozen values above are untouched) ---
  response: peak_speed             # in-game effort speed (yd/s) = the modelled outcome (efforts.csv)
  primary_feature: env_vmax        # Combine ceiling feature (prereg sec3 retained set); maps to efforts.ceiling_speed_yds
  bmi_constant: 703.0              # BMI = constant * weight_lb / height_in^2 (imperial)
  fit_max_iter: 1000               # QuantReg IRLS iteration cap (base fit)
  fit_max_iter_retry: 20000        # QuantReg iteration cap for the refit_increased_max_iter fallback
  fit_p_tol: 1.0e-06               # QuantReg primal tolerance
  bootstrap_ci: [0.025, 0.975]     # percentile CI for the player-clustered bootstrap
  min_obs_per_stratum: 5           # below this a stratum reports a null (never a forced fit)
  control_vif_max: 5.0             # drop near-collinear controls above this VIF (never the primary; = envelope.vif_max)
  utilization_percentiles: [0.05, 0.5, 0.95]  # percentiles summarising the utilization u distribution

# --------------------------------------------------------------------------- #
# Phase 5 — Validation
# --------------------------------------------------------------------------- #
validate:
  out_subdir: validate
  cv_grouping: player              # player-grouped CV
  cv_folds: 5                      # player-grouped CV folds (prereg sec8)
  cv_seed: 20270106
  baseline: controls_only          # compare against a controls-only baseline
  permutation: true
  perm_reps: 1000                  # permutation reps (prereg sec8)
  perm_tau: 0.9                    # tau at which the permutation null is computed
  perm_seed_offset: 202            # permutation RNG seed = config seed + offset (config-driven)
  measurement_error_correction: icc_attenuation  # divide slope by reliability (prereg sec8)
  measurement_error_feature: env_vmax  # feature whose ICC drives the attenuation correction
  min_repeats_for_sensitivity: 2   # thin-repeat threshold (drop_thin_repeats sensitivity)
  sensitivity: [alt_quantiles, drop_thin_repeats, exclude_optouts, margin_grid]  # prereg sec8
  sensitivity_alt_quantiles: [0.5, 0.8, 0.95]   # alt_quantiles sensitivity ladder
  sensitivity_margin_grid: [0.0, 0.01, 0.02, 0.05]  # exceedance margin grid (margin_grid sensitivity)
  optout_fields: [forty, ten_yd_split, combine_height, combine_weight]  # exclude_optouts fields

# --------------------------------------------------------------------------- #
# Phase 0.5 — External pre-Combine expectation proxies (Grinding The Mocks)
# --------------------------------------------------------------------------- #
# Source of truth: the Phase 0.5 spec in notes/phase-0.5-external-proxies.md. The task is to map
# Kaggle `nflId` to a Pre-Combine Expected Draft Position (EDP), filtered to February mock-draft
# snapshots so the EDP is uncontaminated by Combine performance. GTM is the SOLE external source.
# All paths/thresholds/parameters live here (no magic numbers in code).
external:
  # RETIRED live acquisition (D43). The board export below
  # (`data/raw/external/gtm/GTM_BDB_EDP_Snapshots_20261016.csv`) is the exposure source for all
  # 783 exposures in 06_security. The GTM runtime scraper in 00b is a leftover from when we
  # thought no export existed: it is now a RETIRED FALLBACK and must never touch the network.
  # Keep this false. Set true only if the board export is ever lost and a live route is revived.
  enabled: false
  source: gtm                        # Grinding The Mocks (the only in-scope external source)
  out_subdir: external               # outputs/external/ (sample + synthetic labels)
  proxy_file: pre_combine_expectation.parquet   # full run writes outputs/pre_combine_expectation.parquet
  unmatched_file: unmatched_external_ids.csv
  manifest_file: external_data_manifest.md      # written under notes/ (compliance / Kaggle forum)
  raw_cache_dir: external            # data/raw/external/ (raw GTM responses cached before processing)
  years: [2023, 2024, 2025]          # draft classes represented in the Kaggle players.csv
  positions: [WR, TE]                # match-rate assertion population (spec: drafted WRs/TEs)
  require_for_phase4: false          # the proxy is NOT used by the model; board export supersedes it (D43)
  # --- strict deliverable schema (EXACT names + order; asserted on write) ---
  schema: [nflId, Pre_Combine_EDP, match_confidence_score]
  # --- API pacing / bounded acquisition (spec: strict rate limiting) ---
  request_sleep_s: 0.5               # sleep between live calls (rate limit)
  max_retries: 2                     # bounded retries per source beyond the first attempt
  connect_timeout_s: 8
  read_timeout_s: 12
  gtm:
    # Endpoints/URLs attempted (each result + access date logged to notes/external_data_manifest.md).
    endpoints:
      - https://grindingthemocks.com/
      - https://grindingthemocks.shinyapps.io/Dashboard/
    # Raw file(s) expected once an export is obtained; cached under data/raw/external/gtm/.
    raw_files: [gtm_mock_history.csv]
  # --- February snapshot filter (spec Step 1: pre-Combine, uncontaminated by Combine perf) ---
  snapshot:
    month: 2                         # February only (Combine runs late-Feb/early-March)
  # --- EDP aggregation across the retained February snapshots (spec: median/mean per player) ---
  aggregation: median                # median | mean (median is the pre-registered choice)
  # --- fuzzy ID resolution (string similarity on Name + Draft Year + Position + College) ---
  fuzzy:
    name_weight: 0.6                 # weights combine into match_confidence_score in [0,1]
    college_weight: 0.25
    position_weight: 0.15
    year_weight: 0.0                 # draft year is a HARD filter, not a soft weight
    min_score: 0.90                  # accept a match at/above this combined score
    min_name_score: 0.80             # guard: names must be at least this similar
  # --- spec threshold: halt if the drafted WR/TE match rate is not ABOVE this ---
  min_match_rate: 0.85
  # --- synthetic GTM fixture (schema-compliant; NEVER a finding) ---
  synthetic:
    fixture_dir: synthetic/gtm       # under fixtures/ (see src/synthetic_gtm_fixture.py)
    players_file: kaggle_players.csv # fixture players table (schema-compliant subset)
    gtm_file: gtm_mock_history.csv   # fixture raw GTM mock history
    seed: 770077
    n_players: 12
    n_mocks_per_player: 6            # February snapshots per player
    n_unmatched_gtm: 3               # GTM prospects with NO Kaggle player (exercise unmatched)
    n_near_miss: 2                   # deliberate spelling perturbations (exercise fuzzy matching)

  # ------------------------------------------------------------------------- #
  # Security / stakes BOARD (Phase 0 external data — EDP snapshots export).
  # The REAL board schema (below) SUPERSEDES the hypothetical GTM mapping above
  # (notes/decisions.md D37): new security code joins the board on `nfl_id` directly.
  # Permission: the competition's External Data section permits external data (with
  # citation/obligations); Conor confirmed the board is permitted (2026-10-17).
  # Provenance + sha256 are recorded in notes/rules.md and notes/external_data_manifest.md.
  # The board file is NOT committed (data/ is gitignored).
  # ------------------------------------------------------------------------- #
  board:
    enabled: true
    permitted: true                  # Conor 2026-10-17: competition External Data permits it
    # Path is relative to data/raw/ (the mounted drive); the .xlsx twin is ignored.
    file: external/gtm/GTM_BDB_EDP_Snapshots_20261016.csv
    sha256: 4664b369e56dfcbe62de678932059695c2c5b8b128989fa5a9068994857563b4
    n_rows_expected: 3625
    csv_delim: ","
    date_format: "%d/%m/%Y"          # DD/MM/YYYY (raw strings; day values 14/21/28 force DMY)
    # EXACT columns (order as in the file); asserted on read.
    columns: [draft_year, name, position, school, type, nfl_id, n_total, n, edp, edp_rank,
              pos_rank, snapshot_date, snapshot_note]
    type_value: "All"
    # snapshot_note vocabulary and the ONLY pre-Combine exposures (post/week-of never used).
    snapshot_pre: ["2 Weeks Pre-Combine", "1 Week Pre-Combine"]
    snapshot_primary: "1 Week Pre-Combine"
    snapshot_trend_base: "2 Weeks Pre-Combine"
    snapshot_post: ["1 Week Post-Combine", "2 Weeks Post-Combine"]
    snapshot_combine_week: "Combine Week"
    # Board position -> competition (combine) position group (audit d position-mismatch check).
    position_map: {WR: WR, TE: TE, CB: DB, S: DB, EDGE: DL, DT: DL, LB: LB,
                   OT: OL, G: OL, C: OL, QB: QB, RB: RB, ST: ST}
    min_match_rate: 0.85             # halt if board->Combine nfl_id match rate (WR/TE) <= this

# --------------------------------------------------------------------------- #
# Security / stakes analysis (Phase 4 — src/06_security.py) — the new primary axis.
# Pre-Combine information ONLY as exposures (post-Combine / week-of are outcomes).
# Cutoffs/thresholds are fixed in notes/prereg.md before the first full-data run.
# --------------------------------------------------------------------------- #
security:
  out_subdir: security
  exposures_file: security_exposure.parquet  # per-player security exposure table (Phase 4)
  analysis_a_file: analysis_a.json
  primary_position: WR
  replication_position: TE
  drop_missing_primary: true       # Conor: players with NO 1-week-pre snapshot are dropped from B
  # --- legacy mapping (kept for provenance): the old canonical exposure names ---
  edp_column: edp
  consensus_n_column: n
  consensus_total_column: n_total
  # --- primary-model population minima (the merged headline gate) ---
  min_matched_receivers_per_tier: 15   # min matched receivers in each security tier (prereg)
  # --- security tiers (a SENSITIVITY check only; cutoffs fixed from COUNTS in prereg) ---
  tier_method: quantile            # quantile | fixed
  tier_quantiles: [0.3333, 0.6667] # low/mid/high split of log(EDP) (VIF-safe default)
  tier_cutoffs: null               # frozen in prereg before a full run (counts-based)
  # --- exposure table schema (EXACT names + order; asserted on write) ---
  schema: [nfl_id, draft_year, position, position_group, edp_pre, log_edp_pre, edp_trend,
           consensus_share, n_snapshots, has_primary, has_trend, participation_pattern, n_drills]
  # --- analysis A (5A): pre->post-Combine EDP change ~ speed x pre-Combine EDP ---
  analysis_a:
    outcome: edp_change           # post - pre EDP (positive = fell / less secure)
    speed_feature: env_vmax       # shrunken Combine ceiling speed (Phase-2 output)
    standardize_speed: true
    controls: [position_group, draft_year]
    cluster: false                # one row per player; robust (HC1) SEs when clustering is off
    alpha: 0.05
    min_n: 40                     # below this, analysis A is reported as underpowered
    speed_effect_sign: negative    # faster -> lower EDP (market reward) is the expected sign
    # robustness panel: refit the same spec across shrunken speed features (sign-stability check)
    robustness_features: [env_vmax, peak_speed, speed_at_20yd]
    # --- D38: Analysis A is appendix-only (the gate is retired); this is the attenuation panel ---
    attenuation: true             # write outputs/security/analysis_a_attenuation.csv
    reliability_features: [env_vmax, peak_speed, speed_at_20yd]
    attenuation_min_n: 40         # below this a feature's attenuation row is a reported null
    attenuation_note: "approximate classical measurement-error correction: corrected = raw / ICC (prereg validate.measurement_error_correction=icc_attenuation)"
  # --- item (l) power calculation inputs ---
  power:
    alpha: 0.05
    power: 0.80
    residual_sd_log_speed: 0.20   # assumed residual SD of log(game top-k speed)
    exposure_sd_log_edp: 0.70     # assumed SD of log(pre-Combine EDP) (a-priori; sample-labelled)
    min_detectable_effect_abs: 0.0  # headline gate: an MDE above this is 'undetectable at any plausible size'

# --------------------------------------------------------------------------- #
# Phase 5 B–G — security / incentive-exposure models (src/07_security_models.py)
# D38: the spine is INCENTIVE EXPOSURE (a slipping draft stock => a stronger reason to invest in the
# speed mechanism => a SMALLER Combine→game gap). Group assignment uses PRE-COMBINE information ONLY:
# the 1wk-pre vs 2wk-pre EDP trend where available, else within-position tertiles of log(EDP_pre).
# Post-Combine EDP / pre→post change are NEVER used for assignment or any primary model.
# Sign convention: a NEGATIVE `group_coef` means moved_down sits further below its ceiling (a LARGER
# gap) i.e. AGAINST the incentive hypothesis; the hypothesis predicts POSITIVE.
# --------------------------------------------------------------------------- #
security_models:
  out_subdir: security_models
  # --- input filenames (real: outputs/game|security|envelope; synthetic: the fixture dir) ---
  inputs:
    efforts: efforts.csv
    top_k_efforts: top_k_efforts.csv
    player_summary: player_summary.csv
    thresholds_applied: thresholds_applied.csv
    security_exposure: security_exposure.parquet       # real path (outputs/security/)
    security_exposure_csv: security_exposure.csv       # synthetic fixture path
    per_player_envelope: per_player_envelope.csv
    attempt_features: attempt_features.csv
    selection_pool: selection_pool.csv                 # synthetic fixture only (transparency)
    covariates: covariates.csv                         # synthetic fixture only
    reliability: feature_reliability.csv               # synthetic fixture only
    meta: meta.json                                    # synthetic fixture only
  # --- the PRE-COMBINE sort key (D38; thresholded by D40) ---
  sort:
    # ASYMMETRIC THRESHOLD (D40): edp_trend = 1wk-pre - 2wk-pre (positive = EDP number rose = worse).
    # moved_down iff edp_trend >= fall_threshold -- a real fall of 3+ EDP spots, not any movement.
    # high_secure = every other player WITH a trend (edp_trend < threshold) = stable OR rising.
    # There is NO unclassified middle in the trend stratum: a stable player is high_secure by design.
    fall_threshold: 3.0             # PRIMARY: moved_down iff the player fell >= 3 EDP spots
    sensitivity_threshold: 5.0      # DECLARED SENSITIVITY panel (panel_threshold_T5); never tuned
    level_fallback: true            # has_trend=false & has_primary=true -> within-position tertiles
    level_tertiles: [0.3333333333, 0.6666666667]  # bottom = high_secure, top = moved_down
    min_group_n: 15                 # below this a group/scatter is reported as thin (never forced)
    groups: [moved_down, high_secure]        # the two-group contrast (order = sign convention)
    unclassified_label: unclassified
  # --- B: effort-level primary model ---
  primary:
    response: log_peak_speed        # log(in-game top-k effort peak speed)
    speed_feature: env_vmax         # primary Combine feature (config: models.primary_feature)
    robustness_features: [peak_speed, speed_at_20yd]
    controls: [route_family, pass_length, snap_share, position, height, weight, years_since_combine]
    cluster: player                 # statsmodels OLS cov_type="cluster", groups=nfl_id
    attenuation: true               # FWL + ICC moment-matrix correction (both estimates reported)
    attenuation_reps: 200           # player-clustered bootstrap reps for the corrected group SE
    attenuation_seed_offset: 303
    snap_share_clip: 1.0            # snap_share = min(n_route_snaps / route_snap_count, clip)
    min_obs: 40
    # D44 COVARIATE PLAUSIBILITY BOUNDS. An NFL Combine participant cannot be outside these; a
    # value that is (e.g. height 1e200 from a corrupt join) is treated as a CORRUPT ROW, never kept:
    # the field is set to NaN, a WARNING names nfl_id + the raw value, the row drops out of every
    # model, and it is reported in outputs/security_models/covariate_quality.csv + SUMMARY.
    # Bounds are deliberately wide: they catch corruption, not unusual athletes.
    covariate_bounds:
      height_in: [48.0, 90.0]       # 4'0" to 7'6"
      weight_lb: [100.0, 400.0]     # 100 to 400 lb
      bmi: [15.0, 60.0]             # BMI = 703 * weight_lb / height_in^2
    scopes: [WR, TE, pooled]
    stratum_fe: true                # headline = pooled two-group split WITH a stratum fixed effect
    panels: [trend_only, level_fallback]   # pre-declared sensitivity panels (one stratum each)
    topk_mean_variant: true         # per-player log(top-k mean speed) variant (HC1)
    route_family_map:
      GO: VERTICAL
      POST: VERTICAL
      CORNER: VERTICAL
      WHEEL: VERTICAL
      CROSS: BREAK_IN
      IN: BREAK_IN
      SLANT: BREAK_IN
      ANGLE: BREAK_IN
      OUT: BREAK_OUT
      FLAT: BREAK_OUT
      HITCH: SHORT
      SCREEN: SHORT
    route_family_default: OTHER
    season_digits: 4                # season = leading 4 digits of game_id (NFL game ids)
    season_min: 1999
    season_max: 2100
  # --- C: which end drives it (continuous log-EDP piecewise model) ---
  c:
    scopes: [WR, TE, pooled]
    security_percentiles: [0.1, 0.5, 0.9]
    knot_percentiles: [0.3333333333, 0.6666666667]   # piecewise-linear knots in log(EDP_pre)
    min_obs: 40
    wilson_z: 1.959963984540054     # 95% Wilson interval
  # --- D: skippers (exploratory) ---
  d:
    min_n: 15
    alpha: 0.05
    skipper_patterns: [cut_only, no_speed_drills]
    dash_patterns: [dash_only, dash_and_cut]
  # --- E: selection + IPW ---
  e:
    min_n: 60
    min_appeared: 30
    weight_trim: [0.01, 0.99]        # w clipped to these weight percentiles
    weight_grid: [[0.0, 1.0], [0.01, 0.99], [0.05, 0.95]]   # truncation sensitivity grid
    max_iter: 200
    cluster: player
    # separation / non-convergence guards: the odds ratios are reported as a labelled null rather
    # than letting math.exp overflow when a predictor separates (D43).
    separation_max_coef: 20.0        # |coef| above this => separation suspected
    separation_max_se: 50.0          # se above this => separation suspected
    or_exponent_clip: 700.0          # exp() exponent clipped here; overflow reported explicitly
  # --- F: falsification ---
  f:
    placebo: [height, weight]        # standardized placebos in place of the group term
    effort_split_k: 5               # bottom-k low-effort placebo (top-k is the primary)
    min_obs: 40
  # --- G: ceiling / tail ---
  g:
    quantile_source: models.quantiles   # the FROZEN prereg tau ladder
    scopes: [WR, TE, pooled]
    bootstrap_reps: 60              # config reps (player-clustered); full runs may raise this
    seed_offset: 404
    max_iter: 400                   # QR iteration cap for the point fit + bootstrap
    p_tol: 1.0e-05
    instability_ratio: 1.0          # boot_se > ratio * |estimate| => reported null
    min_obs: 40
    utilization_percentiles: [0.5, 0.9, 0.99]
  # --- selection-model population floor (E) ---
  selection:
    min_n: 60
  # --- committed synthetic game-side fixture (NEVER a finding) ---
  synthetic:
    root: synthetic/security_game
    regimes: [planted, null, selection]
    seed_offset: 909
    n_wr: 140                       # >=120 WR (brief minimum)
    n_te: 110                       # >=40 TE (raised for the D40 threshold rule: enough TE moved_down)
    n_edge: 8                       # forced edge-case players (documented in meta.json)
    route_snaps_min: 100            # main population: >=100 route snaps (the fixed denominator)
    route_snaps_max: 170
    low_snap_min: 25                # forced <100-snap edge players
    low_snap_max: 60
    k_top: 5
    k_bottom: 5
    base_gap_log: -0.24             # E[log(game speed) - log(ceiling)] (≈21% below the ceiling)
    gap_player_sd: 0.015
    gap_noise_sd: 0.030
    bottom_gap_offset: 0.14         # low-effort placebo sits clearly below the top-k
    delta: 0.08                     # planted moved_down advantage (log units); null regime = 0
    delta_null: 0.0
    delta_selection: 0.08
    dose_gamma: 0.08                # continuous log(EDP) gradient (at-risk -> smaller gap)
    measurement_noise_sd: 0.02      # env_vmax = true ceiling * exp(noise)
    log_edp_mu: 3.70
    log_edp_sd: 0.75
    combine_speed_mu: 8.90
    combine_speed_sd: 0.75
    trend_share: 0.50               # share with a 2-week snapshot (trend stratum)
    trend_sd_edp: 10.0              # EDP-point SD of the pre-Combine drift (D40: ~38% fall 3+ spots)
    trend_level_corr: 0.60          # at-risk drift correlates with the EDP level (realistic)
    absence_rate: 0.10              # base no-game-data rate (planted/null regimes)
    selection_log_edp_slope: -3.00  # selection regime: at-risk less likely to appear
    selection_speed_slope: 0.45     # better Combine speed -> slightly more likely to appear
    selection_intercept: 1.10
    selection_te_shift: -0.25
    skipper_rate: 0.12              # share of high_secure forced into cut_only/no_speed_drills
    one_effort_players: 2
    low_snap_players: 6
    missing_covariate_players: 2
    no_primary_players: 1
    speed_at_20yd_ratio: 0.94
    attempt_sd: 0.02
    icc: {env_vmax: 0.64, peak_speed: 0.97, speed_at_20yd: 0.97}
    height_mu: 73.0
    height_sd: 2.6
    weight_mu: 200.0
    weight_sd: 16.0

# --------------------------------------------------------------------------- #
# Route-mix robustness for the group contrast (analysis-only; src/08_route_robustness.py)
# D47. Re-estimates block B's exact specification on route strata, leave-one-player-out and a
# player-label permutation. NOT a pre-declared test: it cannot change b_primary.csv or the verdict.
# --------------------------------------------------------------------------- #
route_robustness:
  out_subdir: route_robustness
  perm_reps: 1000                  # player-label permutations (>=1000; fixed seed)
  perm_seed_offset: 505            # permutation RNG seed = config seed + offset
  strata:
    vertical_family: VERTICAL      # the route family tested in isolation (config route_family_map)
    # Depth bands (inclusive, yards). The 'deep' stratum is audit.deep_pass_length_yd (15).
    pass_length_bands: [[0, 9], [10, 19], [20, null]]

# --------------------------------------------------------------------------- #
# Draft-outcome and targeted-route probes (analysis-only; src/09_draft_and_target.py)
# D48. TWO EXPLORATORY checks that never enter the pre-registered §8 panel:
#   A. realised draft capital (POST-Combine) by group, plus the group contrast with
#      log(draft_overall_pick) as a covariate and within draft bands — a mechanism/diagnostic
#      probe, not a clean adjustment (conditioning on a post-Combine outcome can open a collider).
#   B. the same contrast on target==True / target==False / all rows. Target-only is selection on
#      a post-treatment, role-dependent variable; the non-target subset is the decoy/mechanical
#      channel, not a causal estimate.
# min_obs / min_group_n null means "reuse security_models.primary.min_obs / sort.min_group_n".
# --------------------------------------------------------------------------- #
draft_target:
  out_subdir: draft_and_target
  draft_file: null                 # null -> files.players under paths.raw (players.csv)
  round_bands: [[1, 1], [2, 2], [3, 4], [5, 7]]   # descriptive R1 / R2 / R3-4 / R5-7
  strata_bands: [[1, 2], [3, 4], [5, 7]]          # declared bands for the conditional fits
  target_subsets: [all, target, non_target]       # target==True / target==False / everything
  min_obs: null                    # null -> security_models.primary.min_obs
  min_group_n: null                # null -> security_models.sort.min_group_n
  seed_offset: 606                 # reserved for any resampling added later; fixed, never tuned

# --------------------------------------------------------------------------- #
# Deliverables / sample discipline
# --------------------------------------------------------------------------- #
deliverables:
  figures_max: 5                   # <= 5 figures (stricter than the official "<10")
  sample_label: UNVALIDATED SAMPLE OUTPUT
  kaggle_notebook: true            # public Kaggle notebook + writeup is a pass/fail gate
