    min_r2: 0.90
    max_speed_over_vmax: 1.5
    candidate_features: [vmax, tau, a0]
    max_features: 3
    icc_min: 0.50
    vif_max: 5.0
    shrinkage:
      method: reliability_weighted_mean
      min_attempts: 1
    sanity:
      duplicate_attempt_flag: true
      peak_window_gap_flag: true
    out_subdir: ceiling/lc
    summary_filename: summary.json
    output_schema: [nfl_id, draft_year, position, feature, estimate, se, n_attempts, icc, reliability, selected, vif]

  leverage:
    definition_id: wp_swing_4p1mp
    formula: "4 * wp_pre * (1 - wp_pre)"
    source_column: pre_snap_home_team_win_probability
    perspective: home
    require_pre_snap_only: true
    binning:
      method: terciles
      n_bins: 3
      labels: [low, medium, high]
      computed_on: FULL
    garbage_time:
      status: placeholder
      rule: quarter_and_margin
      q4_margin: 21
      any_quarter_margin: 28

  efforts:
    definition_id: route_depth_and_duration
    out_subdir: game/lc/efforts
    summary_filename: efforts_summary.json
    min_route_depth_yd: 5.0
    min_route_depth_yd_sensitivity: 8.0
    min_duration_s: 1.0
    require_pass_route: true
    target_conditioned_primary: false
    sensitivity_without_target: true
    max_speed_source: tracking_s
    load_measures:
      primary: prior_high_intensity_efforts
      secondary: prior_distance_yd

  # --- Phase 4: the within-player leverage estimand (D65 wires it as a stage) ---
  # Every value here mirrors TASK.md Phase 4 as written; no feature is added
  # beyond the declared specification.  `break_depth_yd` is a CONTROL and is
  # reported, never interpreted.
  models:
    out_subdir: game/lc/models
    summary_filename: model_result.json
    outcome: log_max_speed
    leverage_column: leverage_z        # per 1 within-player SD of leverage
    controls: [route_family, break_depth_yd, break_found, time_to_throw_s,
               prior_efforts, quarter, score_margin, down, yards_to_go]
    cluster: player
    # TASK.md Phase 4 convergence fallbacks, in the declared order.
    fallbacks: [uncorrelated_re, player_fixed_effects, random_intercept]
    mixed_max_iter: 500
    variance_component_floor: 1.0e-08  # a slope variance at 0 is a failed rung
    report_depth_control: true
    depth_note: "break_depth_yd is a control; reported, never interpreted"
    mde_note: >-
      Analytic MDE at n efforts/player; D60's 0.0443 log-speed at 40
      efforts/player is stated alongside every interval and is not a gate.

  # --- D61: route depth as DEPTH AT THE BREAK (the depth control in the model) ---
  # Every number below is a design constant frozen in notes/decisions.md D61
  # (D62 relaxes only the break resolution: 45 deg/0.3 s -> 35 deg/0.4 s).
  # The smoother is the existing ceiling smoother
  # (thresholds.smoothing.window_frames); no second smoothing convention exists.
  route_depth:
    definition_id: depth_at_break_v1
    out_subdir: game/lc/route_depth   # outputs/ (never data/interim)
    smoothing_window_frames: 5       # must equal thresholds.smoothing.window_frames (asserted)
    heading_window_s: 0.2            # heading from smoothed velocity over this window
    stem_min_s: 0.8                  # minimum post-snap motion before a break can count
    break_window_s: 0.4              # cumulative |dtheta| is summed over this window (D62)
    break_angle_deg: 35.0            # cumulative turn that defines a break (D62)
    sustain_window_s: 0.3            # the new heading must persist this long
    sustain_angle_deg: 20.0          # ...within this tolerance
    min_frames: 10                   # below this a track cannot support the definition
    min_speed_yds: 2.0               # heading undefined below this local speed
    max_gap_s: 0.5                   # a longer frame gap cannot be spanned by a break window
    nominal_hz: 10                   # only a sanity check; dt comes from the frames
    snap_event: ball_snap            # tracking event marking the snap frame
    throw_event: pass_forward        # tracking event marking the throw frame (not re-derived)
    snap_tolerance_s: 0.15           # play-level snap event must land this near a frame
    sensitivity_max_tracks: 2000     # deterministic subsample for the specification curve
    direction_column: play_direction
    direction_right: right           # play_direction 'right' => +x is downfield
    direction_left: left             # play_direction 'left'  => -x is downfield
    # Declared specification curve: the answer must not be threshold-art.
    robustness:
      break_angle_deg: [35.0, 45.0, 55.0]
      break_window_s: [0.2, 0.3, 0.4]
    # How the control enters the model: family + centred depth + indicator.
    model_control:
      depth_column: break_depth_yd
      indicator_column: break_found
      centre: true                   # depth centred; no scaling (yards stay yards)
      include_after_throw: true      # headline fit keeps every detected break
      exclude_after_throw_sensitivity: true   # sensitivity refit drops them
    # --- D63: the keep-or-fall-back rule for the continuous depth control ---------------
    # D62 fixed the resolution (35 deg / 0.4 s) but no number for choosing between the
    # continuous depth term and the option-4 fallback. This block IS that number. It is
    # evaluated on FULL data only; sample counts are descriptive and never decide it.
    # Derivation (D63): a control must be estimated to ~1/3 of the smallest effect of
    # interest, delta = power.smallest_effect_of_interest / 3 = 0.01; with
    # sigma = power.assumed_within_player_sd_log_speed = 0.10,
    # n_min = (1.96 * sigma / delta)^2 = 384.2; x design-effect allowance 1.3 (efforts
    # cluster within player) = 499.4 -> 500.
    decision_rule:
      definition: "continuous_depth_vs_option4"
      min_pre_throw_breaks: 500        # condition (a): breaks with a known pre-throw timestamp
      min_families_meeting_bar: 6      # condition (b): families carrying within-family depth
      min_pre_throw_breaks_per_family: 25   # per-family floor (SE of median depth ~1 yd)
      fallback: "route_family_plus_break_indicator (D61 option 4)"
      evaluated_on: FULL               # sample output can never satisfy or fail this rule

  power:
    reps: 1000
    alpha: 0.05
    power: 0.80
    smallest_effect_of_interest: 0.03
    equivalence_margin: 0.02
    assumed_within_player_sd_log_speed: 0.10
    assumed_efforts_per_player: 40
    min_detectable_effect_target: 0.03

  gate:
    min_matched_wr: 40
    min_matched_te: 12
    max_leverage_time_partial_corr: 0.50
    min_mde: 0.03
    min_icc: 0.50
    min_efforts_per_player: 20
    min_efforts_per_bin: 5
    min_receivers_both_extremes:
      WR: 30
      TE: 10
    require_wp_available: true
    require_thresholds_provenance: FULL

  fixture:
    seed: 20270107
    n_players: 60
    n_games: 6
    plays_per_game: 16
    frames_per_effort: 34
    tracking_hz: 10
    planted_beta_leverage: 0.05          # log max speed per 1 SD leverage
    planted_within_player_sd: 0.04
    confounded_beta_leverage: 0.0
    confounded_leverage_time_corr: 0.85
    confounded_beta_time_log_speed_per_sd: -0.06
